<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/card.css">
<style>
  html,body{width:1300px;height:820px;}
  .stage{
    width:1300px;height:820px;position:relative;
    display:flex;align-items:center;justify-content:center;
    background:
      radial-gradient(90% 120% at 50% 0%, #2a2a2a 0%, #161616 55%, #0c0c0c 100%);
  }
  .card{
    width:1050px;height:600px;border-radius:22px;overflow:hidden;
    box-shadow: 0 60px 120px rgba(0,0,0,0.55), 0 15px 40px rgba(0,0,0,0.45), 0 0 0 1px rgba(205,168,104,0.15);
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="card bg">
      <div class="back-content">
        <div class="back-mark">
          <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <polygon points="50,6 94,50 50,94 6,50" stroke="#cda868" stroke-width="2"/>
            <path d="M50 26 L66 74 M50 26 L34 74 M40 58 H60" stroke="#f1dfae" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="back-wordmark">
          <div class="awwal">AWWAL DIGITAL</div>
        </div>
        <div class="back-rule"></div>
        <div class="back-tagline">Premium Web &amp; Software Solutions</div>
      </div>
    </div>
  </div>
</body>
</html>
