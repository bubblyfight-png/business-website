<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/card.css">
<style>
  html,body{width:1300px;height:820px;}
  .stage{
    width:1300px;height:820px;position:relative;
    display:flex;align-items:center;justify-content:center;
    background:
      radial-gradient(90% 120% at 50% 0%, #2a2a2a 0%, #161616 55%, #0c0c0c 100%);
  }
  .card{
    width:1050px;height:600px;border-radius:22px;overflow:hidden;
    box-shadow: 0 60px 120px rgba(0,0,0,0.55), 0 15px 40px rgba(0,0,0,0.45), 0 0 0 1px rgba(205,168,104,0.15);
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="card bg">
      <div class="back-content">
        <div class="back-mark">
          <svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="mgBackD" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#f3dfa8"/>
                <stop offset="0.55" stop-color="#cda868"/>
                <stop offset="1" stop-color="#a9822f"/>
              </linearGradient>
            </defs>
            <text x="62" y="182" font-family="Poppins" font-weight="800" font-size="175" fill="url(#mgBackD)" text-anchor="middle">A</text>
            <text x="171" y="182" font-family="Poppins" font-weight="800" font-size="175" fill="url(#mgBackD)" text-anchor="middle">D</text>
            <text x="153" y="140" font-family="Poppins" font-weight="700" font-size="24" fill="#080a0e" text-anchor="middle">&lt;/&gt;</text>
          </svg>
        </div>
        <div class="back-wordmark">
          <span class="lockup awwal">Awwal</span><span class="lockup digital">Digital</span>
        </div>
        <div class="back-tagline-row">
          <div class="back-rule"></div>
          <div class="back-tagline">Building Digital Solutions</div>
          <div class="back-rule"></div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
