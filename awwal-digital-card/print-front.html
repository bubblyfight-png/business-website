<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/card.css">
<style>
  html,body{width:1275px;height:825px;background:#ffffff;}
  .crop-canvas{position:relative;width:1275px;height:825px;}
  .bleed-wrap{position:absolute;left:75px;top:75px;width:1125px;height:675px;overflow:hidden;}
  .content{position:absolute;left:37.5px;top:37.5px;}
  svg.marks{position:absolute;left:0;top:0;width:1275px;height:825px;}
  svg.marks line{stroke:#000;stroke-width:1.25;}
</style>
</head>
<body>
  <div class="crop-canvas">
    <div class="bleed-wrap bg">
      <div class="content">
        <div class="brand-row">
          <div class="mark">
            <svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <linearGradient id="mgFront" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0" stop-color="#f3dfa8"/>
                  <stop offset="0.55" stop-color="#cda868"/>
                  <stop offset="1" stop-color="#a9822f"/>
                </linearGradient>
              </defs>
              <text x="62" y="182" font-family="Poppins" font-weight="800" font-size="175" fill="url(#mgFront)" text-anchor="middle">A</text>
              <text x="171" y="182" font-family="Poppins" font-weight="800" font-size="175" fill="url(#mgFront)" text-anchor="middle">D</text>
            </svg>
          </div>
          <div class="wordmark">
            <span class="lockup awwal">Awwal</span><span class="lockup digital">Digital</span>
          </div>
        </div>
        <div class="tagline">Building Digital Solutions</div>

        <div class="rule"></div>

        <div class="person">
          <div class="id">
            <div class="name">ZAIN KHATRI</div>
            <div class="title">Founder &amp; CEO</div>
          </div>
          <div class="contact">
            <div class="row"><span class="icon">P</span><span>+260 970 282 929</span></div>
            <div class="row"><span class="icon">E</span><span>awwaldigital.zm@gmail.com</span></div>
          </div>
        </div>
      </div>
    </div>

    <svg class="marks">
      <!-- top-left -->
      <line x1="38" y1="112.5" x2="63" y2="112.5"/>
      <line x1="112.5" y1="38" x2="112.5" y2="63"/>
      <!-- top-right -->
      <line x1="1212" y1="112.5" x2="1237" y2="112.5"/>
      <line x1="1162.5" y1="38" x2="1162.5" y2="63"/>
      <!-- bottom-left -->
      <line x1="38" y1="712.5" x2="63" y2="712.5"/>
      <line x1="112.5" y1="762" x2="112.5" y2="787"/>
      <!-- bottom-right -->
      <line x1="1212" y1="712.5" x2="1237" y2="712.5"/>
      <line x1="1162.5" y1="762" x2="1162.5" y2="787"/>
    </svg>
  </div>
</body>
</html>
