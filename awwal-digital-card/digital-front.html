<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/card.css">
<style>
  html,body{width:1300px;height:820px;}
  .stage{
    width:1300px;height:820px;position:relative;
    display:flex;align-items:center;justify-content:center;
    background:
      radial-gradient(90% 120% at 50% 0%, #2a2a2a 0%, #161616 55%, #0c0c0c 100%);
  }
  .card{
    width:1050px;height:600px;border-radius:22px;overflow:hidden;
    box-shadow: 0 60px 120px rgba(0,0,0,0.55), 0 15px 40px rgba(0,0,0,0.45), 0 0 0 1px rgba(205,168,104,0.15);
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="card bg">
      <div class="content">
        <div class="brand-row">
          <div class="mark">
            <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
              <polygon points="50,8 92,50 50,92 8,50" stroke="#cda868" stroke-width="2.5"/>
              <path d="M50 30 L64 70 M50 30 L36 70 M41.5 57 H58.5" stroke="#f1dfae" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <div class="wordmark">
            <div class="awwal">AWWAL</div>
            <div class="digital">DIGITAL</div>
          </div>
        </div>
        <div class="tagline">Premium Web &amp; Software Solutions</div>

        <div class="rule"></div>

        <div class="person">
          <div class="id">
            <div class="name">YOUR NAME</div>
            <div class="title">Founder &amp; CEO</div>
          </div>
          <div class="contact">
            <div class="row"><span class="icon">P</span><span>+1 (000) 000-0000</span></div>
            <div class="row"><span class="icon">E</span><span>hello@awwaldigital.com</span></div>
            <div class="row"><span class="icon">W</span><span>awwaldigital.com</span></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
