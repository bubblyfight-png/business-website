<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/card.css">
<style>
  html,body{width:1300px;height:820px;}
  .stage{
    width:1300px;height:820px;position:relative;
    display:flex;align-items:center;justify-content:center;
    background:
      radial-gradient(90% 120% at 50% 0%, #2a2a2a 0%, #161616 55%, #0c0c0c 100%);
  }
  .card{
    width:1050px;height:600px;border-radius:22px;overflow:hidden;
    box-shadow: 0 60px 120px rgba(0,0,0,0.55), 0 15px 40px rgba(0,0,0,0.45), 0 0 0 1px rgba(205,168,104,0.15);
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="card bg">
      <div class="content">
        <div class="brand-row">
          <div class="mark">
            <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="50" cy="50" r="45" stroke="#cda868" stroke-width="1.8"/>
              <circle cx="50" cy="50" r="39" stroke="#cda868" stroke-width="0.7" opacity="0.55"/>
              <text x="38" y="68" font-family="Playfair Display" font-weight="700" font-size="52" fill="#f1dfae" text-anchor="middle">A</text>
              <text x="66" y="75" font-family="Playfair Display" font-weight="600" font-size="30" fill="#cda868" text-anchor="middle">D</text>
            </svg>
          </div>
          <div class="wordmark">
            <div class="awwal">AWWAL</div>
            <div class="digital">DIGITAL</div>
          </div>
        </div>
        <div class="tagline">Premium Web &amp; Software Solutions</div>

        <div class="rule"></div>

        <div class="person">
          <div class="id">
            <div class="name">ZAIN KHATRI</div>
            <div class="title">Founder &amp; CEO</div>
          </div>
          <div class="contact">
            <div class="row"><span class="icon">P</span><span>+260 970 282 929</span></div>
            <div class="row"><span class="icon">E</span><span>awwaldigital.zm@gmail.com</span></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
