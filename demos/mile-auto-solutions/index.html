<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mile Auto · Demo</title>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap">
<style>
:root { --f:"Plus Jakarta Sans", system-ui, -apple-system, sans-serif; --navy:#0b1733; --indigo:#1f3a8a; --amber:#f5a524; --ink:#0f172a; --ink2:#64748b; --line:#e7ebf2; --bg:#f2f4f8; --card:#fff;
  --red:#e5484d; --redbg:#fdecec; --green:#16a34a; --greenbg:#e7f7ed; --blue:#2f6bff; --bluebg:#eaf0ff; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { margin: 0; font: 15px/1.45 "Plus Jakarta Sans", system-ui, -apple-system, sans-serif; color: var(--ink);
  background: radial-gradient(1200px 600px at 20% -10%, #2a4bb3 0%, transparent 60%), #0b1733; min-height: 100vh; }
.app { max-width: 430px; margin: 0 auto; min-height: 100vh; background: var(--bg); position: relative; padding-bottom: 92px; overflow-x: hidden; }
@media (min-width: 520px) { .app { margin: 24px auto; min-height: calc(100vh - 48px); border-radius: 30px; box-shadow: 0 30px 80px rgba(0,0,0,.45); overflow: hidden; } }
.ribbon { background: var(--amber); color: #3b2600; font-size: 11px; font-weight: 800; letter-spacing: .08em; text-align: center; padding: 6px; }
.screen { display: none; animation: fade .25s ease; } .screen.on { display: block; }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } }
.hero { background: linear-gradient(145deg, #0b1733 0%, #1f3a8a 100%); color: #fff; padding: 18px 18px 64px; border-radius: 0 0 30px 30px; }
.top { display: flex; align-items: center; gap: 10px; }
.logo { width: 38px; height: 38px; border-radius: 12px; background: var(--amber); color: var(--navy); display: grid; place-items: center; font-weight: 800; font-size: 15px; }
.top b { font-size: 16px; } .top small { display: block; color: #9fb0d6; font-size: 12px; font-weight: 500; }
.bell { margin-left: auto; width: 40px; height: 40px; border-radius: 12px; background: rgba(255,255,255,.1); display: grid; place-items: center; position: relative; border: 0; color: #fff; cursor: pointer; }
.bell i { position: absolute; top: 6px; right: 6px; min-width: 17px; height: 17px; border-radius: 9px; background: var(--red); font: 800 10.5px/17px var(--f); font-style: normal; text-align: center; padding: 0 4px; }
.big-l { margin-top: 22px; color: #9fb0d6; font-size: 13px; font-weight: 600; }
.big { font-size: 40px; font-weight: 800; letter-spacing: -.02em; line-height: 1.1; font-variant-numeric: tabular-nums; }
.glass { display: flex; gap: 8px; margin-top: 14px; }
.glass div { flex: 1; background: rgba(255,255,255,.1); border-radius: 14px; padding: 10px 12px; }
.glass small { display: block; color: #9fb0d6; font-size: 11.5px; font-weight: 600; }
.glass b { font-size: 16px; font-variant-numeric: tabular-nums; }
.glass .up { color: #6ee7a0; } .glass .dn { color: #ff9a9d; }
.actions { margin: -40px 16px 0; background: var(--card); border-radius: 20px; padding: 14px 8px; display: grid; grid-template-columns: repeat(3, 1fr); box-shadow: 0 10px 30px rgba(15,23,42,.08); position: relative; }
.act { border: 0; background: none; display: grid; justify-items: center; gap: 6px; font: 700 12.5px var(--f); color: var(--ink); cursor: pointer; }
.act span { width: 46px; height: 46px; border-radius: 15px; display: grid; place-items: center; }
.pad { padding: 0 16px; }
.sec { display: flex; align-items: center; gap: 8px; margin: 22px 0 10px; }
.sec b { font-size: 16px; } .sec .n { font-size: 12px; font-weight: 800; padding: 1px 8px; border-radius: 10px; }
.list { background: var(--card); border-radius: 20px; padding: 4px 14px; }
.row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.row:last-child { border-bottom: 0; }
.av { width: 42px; height: 42px; border-radius: 14px; display: grid; place-items: center; font-weight: 800; font-size: 14px; flex: none; }
.grow { flex: 1; min-width: 0; } .nm { font-weight: 700; } .sm { font-size: 12.5px; color: var(--ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.amt { font-weight: 800; text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tag { display: inline-block; font-size: 11px; font-weight: 800; padding: 2px 7px; border-radius: 8px; margin-top: 3px; }
.tag.r { background: var(--redbg); color: var(--red); } .tag.g { background: var(--greenbg); color: var(--green); } .tag.b { background: var(--bluebg); color: var(--blue); }
.ibtn { width: 38px; height: 38px; border-radius: 12px; border: 0; display: grid; place-items: center; cursor: pointer; flex: none; }
.ibtn.wa { background: #e7f8ee; color: #16a34a; } .ibtn.done { background: var(--line); color: var(--ink2); }
.title { padding: 22px 16px 4px; display: flex; align-items: baseline; justify-content: space-between; }
.title h1 { font-size: 26px; margin: 0; letter-spacing: -.02em; } .title span { color: var(--ink2); font-size: 13px; font-weight: 600; }
.chips { display: flex; gap: 10px; overflow-x: auto; padding: 12px 16px 6px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.pick { border: 0; background: none; display: grid; justify-items: center; gap: 5px; font: 600 11.5px var(--f); color: var(--ink2); cursor: pointer; flex: none; width: 58px; }
.pick .av { width: 52px; height: 52px; border-radius: 18px; border: 2.5px solid transparent; }
.pick.on { color: var(--ink); } .pick.on .av { border-color: var(--blue); }
.who { margin: 8px 16px 0; background: var(--card); border-radius: 20px; padding: 14px; }
.bar { height: 8px; background: var(--line); border-radius: 8px; overflow: hidden; margin: 10px 0 6px; }
.bar i { display: block; height: 100%; background: linear-gradient(90deg, #22c55e, #16a34a); border-radius: 8px; transition: width .4s; }
.split { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--ink2); font-weight: 600; }
.amount { margin: 12px 16px 0; background: var(--card); border-radius: 20px; padding: 16px; text-align: center; }
.amount small { color: var(--ink2); font-weight: 700; font-size: 12px; }
.amount div { display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 38px; font-weight: 800; }
.amount input { font: 800 38px var(--f); border: 0; outline: 0; width: 6.2ch; text-align: left; color: var(--ink); background: none; padding: 0; font-variant-numeric: tabular-nums; }
.methods { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 12px 16px 0; }
.m { border: 2px solid var(--line); background: var(--card); border-radius: 14px; padding: 10px 4px; font: 700 12px var(--f); cursor: pointer; color: var(--ink); display: grid; justify-items: center; gap: 4px; }
.m i { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; font-style: normal; font-size: 11px; font-weight: 800; }
.m.on { border-color: var(--blue); background: var(--bluebg); }
.cta { display: block; width: calc(100% - 32px); margin: 16px 16px 0; border: 0; border-radius: 16px; padding: 16px; font: 800 16px var(--f); color: #fff; background: linear-gradient(135deg, #2f6bff, #1f3a8a); cursor: pointer; box-shadow: 0 10px 24px rgba(47,107,255,.3); }
.car { background: var(--card); border-radius: 20px; padding: 14px; margin: 0 16px 10px; }
.car-top { display: flex; gap: 12px; align-items: center; }
svg.pic { width: 74px; height: 46px; flex: none; border-radius: 12px; }
.track { display: flex; gap: 4px; margin: 12px 0 8px; }
.track i { flex: 1; height: 6px; border-radius: 6px; background: var(--line); }
.track i.d { background: #22c55e; } .track i.c { background: var(--blue); }
.car-bot { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.car-bot b { font-size: 13.5px; }
.next { border: 0; background: var(--bluebg); color: var(--blue); font: 800 13px var(--f); border-radius: 12px; padding: 9px 12px; cursor: pointer; white-space: nowrap; }
.filter { display: flex; gap: 8px; overflow-x: auto; padding: 12px 16px; scrollbar-width: none; }
.filter::-webkit-scrollbar { display: none; }
.f { flex: none; border: 0; background: var(--card); color: var(--ink2); font: 700 12.5px var(--f); padding: 8px 12px; border-radius: 12px; cursor: pointer; }
.f.on { background: var(--navy); color: #fff; }
.cv { margin: 12px 16px 0; background: var(--card); border-radius: 24px; overflow: hidden; box-shadow: 0 12px 30px rgba(15,23,42,.08); }
.cv-h { background: linear-gradient(145deg, #0b1733, #1f3a8a); color: #fff; padding: 18px; }
.cv-h small { color: #9fb0d6; font-weight: 600; }
.cv-h h2 { margin: 4px 0 0; font-size: 21px; }
.cv-b { padding: 16px 18px 18px; }
.steps { list-style: none; margin: 0; padding: 0; position: relative; }
.steps li { display: flex; gap: 12px; align-items: center; padding: 6px 0; font-size: 14px; font-weight: 600; color: var(--ink2); position: relative; }
.steps li::before { content: ""; position: absolute; left: 8px; top: 24px; height: 18px; width: 2px; background: var(--line); }
.steps li:last-child::before { display: none; }
.steps li .o { width: 18px; height: 18px; border-radius: 50%; background: var(--line); flex: none; display: grid; place-items: center; color: #fff; font-size: 10px; z-index: 1; }
.steps li.d { color: var(--ink); } .steps li.d .o { background: #22c55e; } .steps li.d::before { background: #22c55e; }
.steps li.c { color: var(--blue); font-weight: 800; } .steps li.c .o { background: var(--blue); box-shadow: 0 0 0 5px var(--bluebg); }
.nextpay { margin-top: 14px; background: var(--bg); border-radius: 16px; padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; }
.tabs { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: min(430px, 100%); background: rgba(255,255,255,.96); backdrop-filter: blur(10px); border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(4, 1fr); padding: 8px 6px calc(8px + env(safe-area-inset-bottom)); z-index: 20; }
@media (min-width: 520px) { .tabs { bottom: 24px; border-radius: 0 0 30px 30px; } }
.tab { border: 0; background: none; display: grid; justify-items: center; gap: 3px; font: 700 11px var(--f); color: #94a3b8; cursor: pointer; padding: 4px 0; }
.tab.on { color: var(--blue); }
.sheet-bg { position: fixed; inset: 0; background: rgba(11,23,51,.5); z-index: 40; display: flex; align-items: flex-end; justify-content: center; animation: fade .2s; }
.sheet { background: #fff; width: min(430px, 100%); border-radius: 26px 26px 0 0; padding: 10px 18px calc(20px + env(safe-area-inset-bottom)); animation: up .25s ease; }
@keyframes up { from { transform: translateY(40px); } }
.grab { width: 40px; height: 5px; border-radius: 5px; background: var(--line); margin: 0 auto 14px; }
.wa-chat { background: #efe7de; border-radius: 18px; padding: 14px; margin: 12px 0 14px; }
.bubble { background: #d9fdd3; border-radius: 14px 14px 14px 4px; padding: 10px 12px; font-size: 14px; white-space: pre-wrap; max-width: 92%; }
.bubble small { display: block; text-align: right; color: #667781; font-size: 10.5px; margin-top: 3px; }
.btn2 { display: block; width: 100%; border: 0; border-radius: 14px; padding: 14px; font: 800 15px var(--f); cursor: pointer; }
.btn2.wa { background: #22c55e; color: #fff; } .btn2.ghost { background: var(--bg); color: var(--ink); margin-top: 8px; }
.check { width: 64px; height: 64px; border-radius: 50%; background: var(--greenbg); color: var(--green); display: grid; place-items: center; margin: 4px auto 10px; animation: pop .35s ease; }
@keyframes pop { from { transform: scale(.5); opacity: 0; } }
.rc { background: var(--bg); border-radius: 16px; padding: 12px 14px; margin: 12px 0 14px; }
.rc div { display: flex; justify-content: space-between; padding: 4px 0; font-size: 14px; } .rc span { color: var(--ink2); }
.toast { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 12px; font-size: 13.5px; font-weight: 600; z-index: 60; white-space: nowrap; animation: fade .2s; }
.foot { text-align: center; color: #94a3b8; font-size: 11.5px; padding: 22px 16px 0; }
</style>
</head>
<body>
<div class="app">
  <div class="ribbon">DEMO FOR MILE AUTO · SAMPLE DATA</div>

  <!-- HOME -->
  <div class="screen on" data-s="home">
    <div class="hero">
      <div class="top"><div class="logo">MA</div><div><b>Mile Auto</b><small>Cairo Road, Lusaka</small></div>
        <button class="bell" data-go="late" aria-label="Late payments"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg><i id="bellN"></i></button></div>
      <div class="big-l">Owed to you</div>
      <div class="big" id="owed"></div>
      <div class="glass"><div><small>Collected this month</small><b class="up" id="month"></b></div><div><small>Late</small><b class="dn" id="lateAmt"></b></div></div>

      <button class="act" data-go="late"><span style="background:#e7f8ee;color:#16a34a"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-12.4 7.4L3 21l2.1-5.6A8.4 8.4 0 1 1 21 11.5z"/></svg></span>Remind</button>
      <button class="act" data-tab="cars"><span style="background:#fff4e0;color:#d97706"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 17h14M6 17l1.5-5h9L18 17M7.5 12l1.2-3.5h6.6L16.5 12"/><circle cx="8" cy="17.5" r="1.5"/><circle cx="16" cy="17.5" r="1.5"/></svg></span>Cars</button>

      <div class="sec"><b>Due this week</b><span class="n" style="background:var(--bluebg);color:var(--blue)" id="soonN"></span></div>
      <div class="list" id="soonList"></div>
    </div>
  </div>

  <!-- PAYMENT -->
  <div class="screen" data-s="pay">
    <div class="title"><h1>New payment</h1></div>

    <div class="who" id="payWho"></div>
    <div class="amount"><small>AMOUNT RECEIVED</small><div>K<input id="amt" type="number" inputmode="numeric" min="1" aria-label="Amount"></div></div>
    <div class="methods" id="methods"></div>
    <button class="cta" id="save">Save payment</button>
    <div class="pad"><div class="sec"><b>Recent</b></div><div class="list" id="recent"></div></div>

  <!-- CARS -->
  <div class="screen" data-s="cars">
    <div class="title"><h1>Cars</h1><span id="carsN"></span></div>
    <div class="filter" id="filter"></div>
    <div id="carList"></div>
  </div>

  <!-- CLIENT VIEW -->
  <div class="screen" data-s="client">
    <div class="title"><h1>Client view</h1><span>their private link</span></div>
    <div class="chips" id="cvPick"></div>
    <div class="cv" id="cv"></div>
  </div>

  <div class="foot">Demo by Zain · built to fit how Mile Auto works</div>

  <nav class="tabs">
    <button class="tab on" data-tab="home"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</button>
    <button class="tab" data-tab="pay"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="3"/><path d="M2 10h20"/></svg>Payments</button>
    <button class="tab" data-tab="cars"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 17h14M6 17l1.5-5h9L18 17M7.5 12l1.2-3.5h6.6L16.5 12"/><circle cx="8" cy="17.5" r="1.5"/><circle cx="16" cy="17.5" r="1.5"/></svg>Cars</button>

  </nav>
</div>

<script>
(function () {
"use strict";
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const K = n => "K " + Math.round(Number(n) || 0).toLocaleString("en-US");
const DAY = 864e5, today = new Date(); today.setHours(12, 0, 0, 0);
const dayOf = o => new Date(today.getTime() + o * DAY);
const fmt = d => d.toLocaleDateString("en-GB", { day: "numeric", month: "short" });
const first = n => String(n).split(" ")[0];
const ini = n => n.split(" ").map(w => w[0]).join("").slice(0, 2);
const STAGES = ["Japan", "On the ship", "Dar es Salaam", "Nakonde border", "ZRA clearing", "Ready", "Handed over"];
const STAGE_LONG = ["Bought in Japan", "On the ship", "At Dar es Salaam port", "Crossing at Nakonde", "Clearing in Lusaka (ZRA)", "Ready for collection", "Handed over"];
const COLORS = [["#eaf0ff", "#2f6bff"], ["#fff4e0", "#d97706"], ["#e7f8ee", "#16a34a"], ["#fdecf5", "#db2777"], ["#efeaff", "#7c3aed"], ["#e6f6fb", "#0891b2"], ["#fdecec", "#e5484d"]];
const METHODS = [["MTN MoMo", "#ffcc00", "#3b2f00", "MTN"], ["Airtel Money", "#e5484d", "#fff", "A"], ["Bank", "#1f3a8a", "#fff", "B"], ["Cash", "#16a34a", "#fff", "K"]];

const C = [
  { id: 1, name: "Chanda Mwale", car: "2017 Toyota Vitz", hue: 210, price: 92000, inst: 18250, due: 7, stage: 2, pays: [[-58, 36800, "Bank"], [-27, 18700, "MTN MoMo"]] },
  { id: 2, name: "Mwila Kapata", car: "2016 Toyota Premio", hue: 0, price: 128000, inst: 13000, due: 3, stage: 4, pays: [[-80, 51200, "Bank"], [-62, 12700, "Airtel Money"], [-45, 12700, "MTN MoMo"], [-28, 12700, "MTN MoMo"], [-11, 12700, "Airtel Money"]] },
  { id: 3, name: "Bwalya Ngosa", car: "2018 Honda Fit Hybrid", hue: 145, price: 115000, inst: 20125, due: -4, stage: 1, pays: [[-34, 34500, "Bank"]] },
  { id: 4, name: "Natasha Phiri", car: "2015 Toyota Hilux Surf", hue: 30, price: 210000, inst: 42000, due: null, stage: 5, pays: [[-95, 84000, "Bank"], [-65, 42000, "Bank"], [-35, 42000, "Cash"], [-6, 42000, "Bank"]] },
  { id: 5, name: "Mutale Sichone", car: "2019 Nissan Note e-Power", hue: 270, price: 124000, inst: 21700, due: 26, stage: 0, pays: [[-2, 37200, "Bank"]] },
  { id: 6, name: "Kelvin Banda", car: "2016 Mazda Demio", hue: 350, price: 78000, inst: 15600, due: -9, stage: 3, pays: [[-70, 31200, "MTN MoMo"], [-39, 15600, "MTN MoMo"]] },
  { id: 7, name: "Grace Mulenga", car: "2018 Toyota Sienta", hue: 190, price: 135000, inst: 27000, due: 1, stage: 1, pays: [[-48, 54000, "Bank"], [-17, 27000, "Airtel Money"]] },
];
const paid = c => c.pays.reduce((a, p) => a + p[1], 0);
const bal = c => Math.max(0, c.price - paid(c));
const nxt = c => Math.min(c.inst, bal(c));
const col = c => COLORS[(c.id - 1) % COLORS.length];
const av = (c, big) => `<div class="av" style="background:${col(c)[0]};color:${col(c)[1]}">${ini(c.name)}</div>`;
const carPic = h => `<svg class="pic" viewBox="0 0 148 92"><rect width="148" height="92" rx="14" fill="hsl(${h} 70% 95%)"/><path d="M18 62 L28 44 Q32 38 42 37 L96 36 Q106 36 113 43 L128 55 Q138 56 140 62 L140 68 L18 68 Z" fill="hsl(${h} 55% 45%)"/><path d="M45 42 L94 41 Q101 41 106 46 L112 53 L40 54 Z" fill="hsl(${h} 70% 90%)"/><circle cx="46" cy="69" r="9" fill="#1f2937"/><circle cx="46" cy="69" r="3.5" fill="#cbd5e1"/><circle cx="114" cy="69" r="9" fill="#1f2937"/><circle cx="114" cy="69" r="3.5" fill="#cbd5e1"/></svg>`;
const WA = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-12.4 7.4L3 21l2.1-5.6A8.4 8.4 0 1 1 21 11.5z"/></svg>`;
const TICK = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>`;
const reminded = new Set();
let payId = 3, method = "MTN MoMo", carFilter = -1, cvId = 2, rcNo = 231;

function toast(t) { const el = document.createElement("div"); el.className = "toast"; el.textContent = t; document.body.appendChild(el); setTimeout(() => el.remove(), 2200); }
function sheet(html) {
  const bg = document.createElement("div"); bg.className = "sheet-bg";
  bg.innerHTML = `<div class="sheet"><div class="grab"></div>${html}</div>`;
  bg.addEventListener("click", e => { if (e.target === bg || e.target.closest("[data-x]")) bg.remove(); });
  document.body.appendChild(bg); return bg;
}
function waSheet(title, msg, btn, onSend) {
  const s = sheet(`<b style="font-size:18px">${esc(title)}</b><div class="wa-chat"><div class="bubble">${esc(msg)}<small>${new Date().toTimeString().slice(0, 5)} ✓✓</small></div></div>
    <button class="btn2 wa" id="send">${btn}</button><button class="btn2 ghost" data-x>Close</button>`);
  s.querySelector("#send").onclick = () => { s.remove(); onSend && onSend(); };
}
function go(tab) {
  $$(".screen").forEach(s => s.classList.toggle("on", s.dataset.s === tab));
  $$(".tab").forEach(t => t.classList.toggle("on", t.dataset.tab === tab));
  window.scrollTo(0, 0); render();
}

function renderHome() {
  const late = C.filter(c => c.due !== null && c.due < 0 && bal(c));
  const soon = C.filter(c => c.due !== null && c.due >= 0 && c.due <= 7 && bal(c)).sort((a, b) => a.due - b.due);
  const m = today.getMonth(); let month = 0;
  C.forEach(c => c.pays.forEach(p => { if (dayOf(p[0]).getMonth() === m) month += p[1]; }));
  $("#owed").textContent = K(C.reduce((a, c) => a + bal(c), 0));
  $("#month").textContent = K(month);
  $("#lateAmt").textContent = late.length ? K(late.reduce((a, c) => a + nxt(c), 0)) : "K 0";
  const pending = late.filter(c => !reminded.has(c.id)).length;
  $("#bellN").textContent = pending; $("#bellN").style.display = pending ? "" : "none";
  $("#lateN").textContent = late.length; $("#soonN").textContent = soon.length;
  $("#lateList").innerHTML = late.map(c => `<div class="row">${av(c)}<div class="grow"><div class="nm">${esc(c.name)}</div><div class="sm">${esc(c.car)}</div></div>
      <div><div class="amt">${K(nxt(c))}</div><div style="text-align:right"><span class="tag r">${-c.due}d late</span></div></div>
      <button class="ibtn ${reminded.has(c.id) ? "done" : "wa"}" data-remind="${c.id}" aria-label="Remind">${reminded.has(c.id) ? TICK : WA}</button></div>`).join("")
    || `<div class="row"><div class="grow sm" style="padding:6px 0">Everyone is up to date 🎉</div></div>`;
  $("#soonList").innerHTML = soon.map(c => `<div class="row">${av(c)}<div class="grow"><div class="nm">${esc(c.name)}</div><div class="sm">${esc(c.car)}</div></div>
      <div><div class="amt">${K(nxt(c))}</div><div style="text-align:right"><span class="tag b">${c.due === 0 ? "today" : c.due === 1 ? "tomorrow" : fmt(dayOf(c.due))}</span></div></div></div>`).join("")
    || `<div class="row"><div class="grow sm" style="padding:6px 0">Nothing due this week</div></div>`;
}

function renderPay() {
  const open = C.filter(c => bal(c));
  if (!open.find(c => c.id === payId)) payId = open[0] ? open[0].id : null;
  $("#payPick").innerHTML = open.map(c => `<button class="pick ${c.id === payId ? "on" : ""}" data-pay="${c.id}">${av(c)}${esc(first(c.name))}</button>`).join("");
  const c = C.find(x => x.id === payId);
  if (c) {
    const pct = Math.round(100 * paid(c) / c.price);
    $("#payWho").innerHTML = `<div style="display:flex;align-items:center;gap:12px">${carPic(c.hue)}<div class="grow"><div class="nm">${esc(c.name)}</div><div class="sm">${esc(c.car)}</div></div>
      ${c.due !== null && c.due < 0 ? `<span class="tag r">late</span>` : ""}</div>
      <div class="bar"><i style="width:${pct}%"></i></div><div class="split"><span>Paid ${K(paid(c))}</span><span>Left ${K(bal(c))}</span></div>`;
    if (document.activeElement !== $("#amt")) $("#amt").value = nxt(c);
  }
  $("#methods").innerHTML = METHODS.map(([n, bg, fg, s]) => `<button class="m ${n === method ? "on" : ""}" data-method="${n}"><i style="background:${bg};color:${fg}">${s}</i>${n.replace(" Money", "").replace("MTN MoMo", "MoMo")}</button>`).join("");
  const rec = []; C.forEach(c => c.pays.forEach(p => rec.push([p[0], p[1], p[2], c]))); rec.sort((a, b) => b[0] - a[0]);
  $("#recent").innerHTML = rec.slice(0, 5).map(([d, a, m, c]) => `<div class="row">${av(c)}<div class="grow"><div class="nm">${esc(c.name)}</div><div class="sm">${d === 0 ? "Today" : fmt(dayOf(d))} · ${esc(m)}</div></div><div class="amt" style="color:var(--green)">+${K(a)}</div></div>`).join("");
}
function savePay() {
  const c = C.find(x => x.id === payId), amt = Math.round(Number($("#amt").value));
  if (!c || !amt || amt <= 0) return toast("Enter an amount");
  if (amt > bal(c)) return toast("More than the balance (" + K(bal(c)) + ")");
  c.pays.push([0, amt, method]);
  if (!bal(c)) c.due = null; else if (amt >= c.inst || c.due < 0) c.due = Math.max(c.due, 0) + 30;
  reminded.delete(c.id); rcNo++;
  const s = sheet(`<div class="check"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
    <div style="text-align:center"><div style="font-size:28px;font-weight:800">${K(amt)}</div><div class="sm">from ${esc(c.name)}</div></div>
    <div class="rc"><div><span>Receipt</span><b>MA-${rcNo}</b></div><div><span>Car</span><b>${esc(c.car)}</b></div><div><span>Method</span><b>${esc(method)}</b></div>
      <div><span>Balance</span><b style="color:${bal(c) ? "var(--ink)" : "var(--green)"}">${bal(c) ? K(bal(c)) : "Paid in full 🎉"}</b></div>
      ${c.due !== null ? `<div><span>Next</span><b>${K(nxt(c))} · ${fmt(dayOf(c.due))}</b></div>` : ""}</div>
    <button class="btn2 wa" id="rcSend">Send receipt on WhatsApp</button><button class="btn2 ghost" data-x>Done</button>`);
  s.querySelector("#rcSend").onclick = () => { s.remove(); toast("Receipt sent to " + first(c.name)); };
  render();
}

function renderCars() {
  const active = C.filter(c => c.stage < 6);
  $("#carsN").textContent = active.length + " active";
  $("#filter").innerHTML = [[-1, "All"], ...STAGES.slice(0, 6).map((s, i) => [i, s])].map(([i, s]) => {
    const n = i < 0 ? active.length : C.filter(c => c.stage === i).length;
    return `<button class="f ${carFilter === i ? "on" : ""}" data-filter="${i}">${s} · ${n}</button>`; }).join("");
  const list = active.filter(c => carFilter < 0 || c.stage === carFilter);
  $("#carList").innerHTML = list.map(c => `<div class="car"><div class="car-top">${carPic(c.hue)}<div class="grow"><div class="nm">${esc(c.car)}</div><div class="sm">${esc(c.name)}</div>
      ${bal(c) ? `<span class="tag ${c.due !== null && c.due < 0 ? "r" : "b"}">${K(bal(c))} left</span>` : `<span class="tag g">Paid</span>`}</div></div>
      <div class="track">${STAGES.slice(0, 6).map((_, i) => `<i class="${i < c.stage ? "d" : i === c.stage ? "c" : ""}"></i>`).join("")}</div>
      <div class="car-bot"><b>${STAGE_LONG[c.stage]}</b><button class="next" data-move="${c.id}">${c.stage === 5 ? "Hand over" : "Next →"}</button></div></div>`).join("")
    || `<div class="pad sm" style="text-align:center;padding:30px">No cars here</div>`;
}
function moveCar(c) {
  if (c.stage === 5 && bal(c)) {
    return sheet(`<div class="check" style="background:var(--redbg);color:var(--red)">!</div><div style="text-align:center"><b style="font-size:18px">${K(bal(c))} still owed</b><div class="sm" style="margin:4px 0 16px">${esc(c.name)} must clear the balance first.</div></div><button class="btn2 ghost" data-x>OK</button>`);
  }
  c.stage++;
  const msg = c.stage === 6 ? `Hi ${first(c.name)}, congratulations on your ${c.car}! 🚗 Thank you for choosing Mile Auto.`
    : c.stage === 5 ? `Hi ${first(c.name)}, your ${c.car} is ready for collection at Mile Auto, Cairo Road! 🎉`
    : `Hi ${first(c.name)}, update from Mile Auto: your ${c.car} is now ${STAGE_LONG[c.stage].toLowerCase()}. 🚢`;
  waSheet(STAGE_LONG[c.stage], msg, "Sent automatically ✓", null);
  render();
}

function renderClient() {
  $("#cvPick").innerHTML = C.filter(c => c.stage < 6).map(c => `<button class="pick ${c.id === cvId ? "on" : ""}" data-cv="${c.id}">${av(c)}${esc(first(c.name))}</button>`).join("");
  const c = C.find(x => x.id === cvId) || C[0], pct = Math.round(100 * paid(c) / c.price);
  $("#cv").innerHTML = `<div class="cv-h"><div style="display:flex;align-items:center;gap:10px"><div class="logo" style="width:32px;height:32px;font-size:12px;border-radius:10px">MA</div><small>Mile Auto · your car</small></div>
      <h2>Hi ${esc(first(c.name))} 👋</h2><div style="color:#cbd5f5;font-weight:600">${esc(c.car)}</div></div>
    <div class="cv-b"><ul class="steps">${STAGE_LONG.map((s, i) => `<li class="${i < c.stage ? "d" : i === c.stage ? "c" : ""}"><span class="o">${i < c.stage ? "✓" : ""}</span>${s}</li>`).join("")}</ul>
      <div class="bar" style="margin-top:14px"><i style="width:${pct}%"></i></div><div class="split"><span>Paid ${K(paid(c))}</span><span>${pct}%</span></div>
      ${bal(c) ? `<div class="nextpay"><div><div class="sm">Next payment</div><b style="font-size:18px">${K(nxt(c))}</b></div>${c.due !== null ? `<span class="tag ${c.due < 0 ? "r" : "b"}">${fmt(dayOf(c.due))}</span>` : ""}</div>`
               : `<div class="nextpay" style="background:var(--greenbg)"><b style="color:var(--green)">Fully paid 🎉</b></div>`}
    </div>`;
}

function render() { renderHome(); renderPay(); renderCars(); renderClient(); }

document.addEventListener("click", e => {
  const t = e.target.closest("[data-tab],[data-go],[data-remind],[data-pay],[data-method],[data-filter],[data-move],[data-cv],#save");
  if (!t) return;
  if (t.dataset.tab) return go(t.dataset.tab);
  if (t.dataset.go) { if (!$(".screen[data-s=home]").classList.contains("on")) go("home"); return $("#" + t.dataset.go).scrollIntoView({ behavior: "smooth", block: "start" }); }
  if (t.dataset.remind) { const c = C.find(x => x.id === +t.dataset.remind);
    return waSheet("Reminder to " + first(c.name), `Hi ${first(c.name)}, a friendly reminder from Mile Auto 🙏\n\nYour payment of ${K(nxt(c))} for the ${c.car} was due on ${fmt(dayOf(c.due))}.\n\nPay by MTN MoMo, Airtel Money or bank. Your car is ${STAGE_LONG[c.stage].toLowerCase()}.`,
      "Send on WhatsApp", () => { reminded.add(c.id); toast("Reminder sent ✓"); render(); }); }
  if (t.dataset.pay) { payId = +t.dataset.pay; $("#amt").blur(); return renderPay(); }
  if (t.dataset.method) { method = t.dataset.method; return renderPay(); }
  if (t.dataset.filter !== undefined) { carFilter = +t.dataset.filter; return renderCars(); }
  if (t.dataset.move) return moveCar(C.find(x => x.id === +t.dataset.move));
  if (t.dataset.cv) { cvId = +t.dataset.cv; return renderClient(); }
  if (t.id === "save") savePay();
});
render();
})();
</script>
</body>
</html>
